services:
  universal-wait-times:
    build: .
    container_name: universal-wait-times
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8089/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
